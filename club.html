<!DOCTYPE html>
<html>
<head>
    <title>Campus Club Membership</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h1 {
            color: #234477;
            text-align: center;
            margin: 20px;
        }

        .topnav {
            background-color: #333;
            height: 46px;
            position: sticky;
            top: 0;
        }

        .topnav a {
            float: left;
            color: white;
            text-decoration: none;
            padding: 14px 16px;
        }

        .topnav a:hover {
            background-color: #555;
        }

        .card {
            width: 400px;
            margin: 30px auto;
            padding: 15px;
            border: 2px solid #234477;
            border-radius: 10px;
            background-color: white;
            box-shadow: 4px 4px 8px gray;
            position: relative;
        }

        .card > h2 {
            color: green;
            margin-top: 0;
        }

        .card p {
            font-style: italic;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 8px;
            border-radius: 5px;
            background-color: red;
            color: white;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        select,
        textarea {
            width: 95%;
            padding: 6px;
        }

        .choice label,
        .rule label {
            display: inline;
        }

        textarea {
            height: 80px;
        }

        .join-button {
            margin-top: 12px;
            padding: 8px 14px;
        }

        .content {
            padding: 10px 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 id="home">Programming Club</h1>

    <div class="topnav">
        <a href="#home">Home</a>
        <a href="#events">Events</a>
        <a href="#join">Join</a>
    </div>

    <div class="content" id="events">
        <h2>Campus Club Membership</h2>
        <p>Explore club events and sign up to become a member.</p>
    </div>

    <div class="card" id="join">
        <span class="badge">NEW</span>
        <h2>Join the Club</h2>
        <p>Complete the form below to join the Programming Club.</p>

        <form action="" method="post">
            <fieldset>
                <legend>Join the Club</legend>

                <label for="full-name">Full Name:</label>
                <input type="text" id="full-name" name="full-name" minlength="3" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="student-id">Student ID:</label>
                <input type="text" id="student-id" name="student-id" placeholder="24-56789-1" pattern="[0-9]{2}-[0-9]{5}-[0-9]" required>

                <label for="age">Age:</label>
                <input type="number" id="age" name="age" min="17" max="40" required>

                <label for="general">Membership Type:</label>
                <div class="choice">
                    <input type="radio" id="general" name="membership-type" value="General" required>
                    <label for="general">General</label>
                    <input type="radio" id="executive" name="membership-type" value="Executive">
                    <label for="executive">Executive</label>
                </div>

                <label for="club">Preferred Club:</label>
                <select id="club" name="club" required>
                    <option value="">Select a club</option>
                    <option value="Programming">Programming</option>
                    <option value="Robotics">Robotics</option>
                    <option value="Debate">Debate</option>
                </select>

                <label for="reason">Why do you want to join?</label>
                <textarea id="reason" name="reason" maxlength="200" required></textarea>

                <div class="rule">
                    <input type="checkbox" id="agree" name="agree" required>
                    <label for="agree">I agree to the club rules</label>
                </div>

                <button class="join-button" type="submit">Join Now</button>
            </fieldset>
        </form>
    </div>
</body>
</html>
